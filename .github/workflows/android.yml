
name: Build Container Reminder APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ContainerReminder.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q ContainerReminder.zip -d source

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          FILE=$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts in the ZIP"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ContainerReminder-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
